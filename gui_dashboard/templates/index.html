<!DOCTYPE html>
<title>UAV Multi-Modal Detection Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" crossorigin></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>

<style>
  html, body { background:#0b0d10; color:#e5e7eb; height:100%; margin:0; overflow:hidden; }
  #root { height:100vh; overflow:hidden; }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  .tab-btn { padding:6px 14px; font-size:0.8rem; border-bottom:2px solid transparent; color:#8b93a1; }
  .tab-btn.active { color:#e5e7eb; border-bottom-color:#3b82f6; }

  @keyframes breathe { 0%,100%{opacity:.45} 50%{opacity:1} }
  @keyframes blink2hz { 0%,49%{opacity:1} 50%,100%{opacity:.3} }
  @keyframes pulseFast { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.55; transform:scale(1.2)} }
  @keyframes borderFlash { 0%,100%{ box-shadow: inset 0 0 0 7px rgba(239,68,68,.95); } 50%{ box-shadow: inset 0 0 0 7px rgba(239,68,68,0); } }

  .led-idle { background:#6b7280; }
  .led-calibrating { background:#a855f7; animation: breathe 1.4s ease-in-out infinite; }
  .led-searching { background:#3b82f6; animation: breathe 2s ease-in-out infinite; }
  .led-slewing { background:#eab308; }
  .led-tracking { background:#f97316; animation: blink2hz .5s steps(1,end) infinite; }
  .led-engaged { background:#ef4444; animation: pulseFast .3s ease-in-out infinite; }
  .led-degraded { background:#dc2626; }

  .engaged-flash::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    animation: borderFlash .6s ease-in-out infinite;
  }

  .hc body, .hc { filter: contrast(1.25) brightness(1.15); }
  .hc .bg-panel { background:#000 !important; border-color:#fff !important; }

  .bg-panel { background:#14171c; border:1px solid #262b33; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#3a4048; border-radius:4px; }

  .spectro-canvas { image-rendering: pixelated; width:100%; height:100%; background:#000; }
  .pending-ring { box-shadow: 0 0 0 2px #eab308 inset; }

  /* --- Structural skeleton: plain hand-written CSS, not Tailwind utility classes.
     These are load-bearing (must never collapse/overflow) so they cannot depend on
     the Tailwind CDN's runtime JIT compiler having generated the right rules in time.
     Tailwind classes are still used everywhere else for color/spacing/decoration. --- */
  .app-shell { height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .header-bar { min-height: 64px; flex-shrink: 0; flex-wrap: wrap; row-gap: 4px; }
  .header-bar > * { flex-shrink: 0; white-space: nowrap; }
  .main-row { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: row; overflow: hidden; }
  .tactical-col { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* #0b0d10 (not pure black) so the letterbox margin around a narrower-than-
     .video-box .video-frame reads as page background, not a second black
     void merging into the video's own black - same intent as a normal video
     player's letterbox bars. */
  .video-box { flex: 1 1 auto; min-height: 0; overflow: hidden; background: #0b0d10; display: flex; align-items: center; justify-content: center; }
  /* height: 100% (a definite size, from .video-box's own definite flex
     height) lets aspect-ratio correctly derive width from it - giving
     .video-frame itself a tight 16:9 box instead of stretching to fill all
     of .video-box's (much wider) width. max-width covers the case where
     .video-box is narrower than tall, so the derived width would overflow.
     (A previous version of this rule tried aspect-ratio with NEITHER
     dimension definite - only max-width/max-height - which resolves to 0x0
     for a flex item whose only content is `position: absolute` and so
     contributes nothing to auto content-sizing; confirmed via
     canvas.getBoundingClientRect(). The fix here keeps one axis definite so
     that edge case never applies.) */
  .video-frame { position: relative; height: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
  .compass-strip { flex-shrink: 0; overflow: hidden; }
  .sidebar-col { width: 320px; flex-shrink: 0; min-height: 0; overflow-y: auto; }
  .bottom-panel { flex-shrink: 0; height: 160px; overflow: hidden; display: flex; flex-direction: column; }
  .tab-scroll-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .chart-mini { height: 90px; overflow: hidden; display: flex; flex-direction: column; }
  .chart-mini canvas { flex: 1 1 auto; min-height: 0; width: 100%; }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

const STATE_COLORS = {
  IDLE: "led-idle", CALIBRATING: "led-calibrating", SEARCHING: "led-searching", SLEWING: "led-slewing",
  TRACKING: "led-tracking", ENGAGED: "led-engaged", DEGRADED: "led-degraded",
};

// Shared column widths for the Detection Events header row + every event row,
// so they always line up (see the "genuinely fixed header" note further down).
const EVENT_GRID_COLS = "1.2fr 0.85fr 0.65fr 0.85fr 0.85fr 0.85fr 0.75fr";

// liveHardware: true => actually wired to the real system (config.YOLO_LOW_CONF_THRESHOLD /
// config.YOLO_HIGH_CONF_THRESHOLD / config.AUDIO_CLASSIFICATION_THRESHOLD via
// hardware_bridge.py). Everything else only affects the simulated/replay pipelines -
// dimmed + labeled when running live on hardware.
const SLIDER_DEFS = [
  { key: "yolo_threshold_low", label: "YOLO Low Threshold", min: 0, max: 1, step: 0.01, liveHardware: true,
    tip: "Candidate-detection floor: YOLO must clear this confidence just to be considered a possible drone at all (hysteresis lock-on lower bound)." },
  { key: "yolo_threshold_high", label: "YOLO High Threshold", min: 0, max: 1, step: 0.01, liveHardware: true,
    tip: "Confirmed-lock ceiling: once confidence clears this value the visual lock is confirmed and held even if it later dips back toward the low threshold (hysteresis)." },
  { key: "audio_threshold", label: "Acoustic CNN Threshold", min: 0, max: 1, step: 0.01, liveHardware: true,
    tip: "Probability cutoff for the Audio CNN classifier to trigger an acoustic detection alarm." },
];

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square"; osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 250);
  } catch (e) { /* audio not available */ }
}

function fmt(n, d = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "N/A";
  return Number(n).toFixed(d);
}

// The /video_feed multipart/x-mixed-replace stream's underlying network
// request, when loaded via a plain <img src="/video_feed">, has been observed
// (devtools: Initiator "img", NS_BINDING_ABORTED, reproduced on both Chrome
// and Firefox) getting silently aborted right after the <img> mounts, while a
// second, unrelated request to the same URL keeps flowing fine - the <img>
// element itself never reliably decodes this content-type. A plain src
// refresh doesn't fix it (still fails almost every retry) - the most likely
// explanation is that current browsers no longer treat
// multipart/x-mixed-replace as valid content for the <img> "image"
// destination at all, regardless of retries.
//
// Workaround: bypass <img> entirely. fetch() the same stream as raw bytes,
// parse the multipart boundaries ourselves, and hand each extracted JPEG to
// createImageBitmap() (the browser's own hardware-accelerated decoder - same
// one <img> would have used) before drawing it to a <canvas> with
// ctx.drawImage(). This is client-side only; the server, the byte stream, and
// the frame rate are all unchanged. object-fit still applies to <canvas> the
// same way it did to <img>, so canvas.width/height are set to each decoded
// frame's real size and the same CSS classes reproduce identical letterboxing.
const FRAME_BOUNDARY = new TextEncoder().encode("--frame");
const HEADER_END = new TextEncoder().encode("\r\n\r\n");

function indexOfBytes(haystack, needle, fromIndex) {
  const limit = haystack.length - needle.length;
  outer:
  for (let i = fromIndex; i <= limit; i++) {
    for (let j = 0; j < needle.length; j++) {
      if (haystack[i + j] !== needle[j]) continue outer;
    }
    return i;
  }
  return -1;
}

function VideoFeed() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const controller = new AbortController();
    let cancelled = false;
    // Diagnostics only (temporary) - one line per outcome, not per frame, so
    // it's easy to tell "never receiving frames" apart from "receiving but
    // failing to decode" apart from "decoding fine but not drawing" from the
    // console alone.
    let framesDrawn = 0;
    let decodeFailures = 0;

    async function drainFrames(buf) {
      // Consumes as many complete JPEG parts as are currently buffered,
      // decoding + drawing each one; returns whatever partial bytes are left
      // over (an in-progress frame still waiting on more chunks).
      while (true) {
        const headerEnd = indexOfBytes(buf, HEADER_END, 0);
        if (headerEnd === -1) return buf;
        const jpegStart = headerEnd + HEADER_END.length;
        const nextBoundary = indexOfBytes(buf, FRAME_BOUNDARY, jpegStart);
        if (nextBoundary === -1) return buf; // this frame isn't fully in yet

        const jpegEnd = nextBoundary - 2; // trim the "\r\n" before "--frame"
        const jpegBytes = buf.slice(jpegStart, Math.max(jpegStart, jpegEnd));
        buf = buf.slice(nextBoundary);

        if (jpegBytes.length === 0) continue;
        try {
          const bitmap = await createImageBitmap(new Blob([jpegBytes], { type: "image/jpeg" }));
          const canvas = canvasRef.current;
          framesDrawn++;
          if (canvas && !cancelled) {
            if (canvas.width !== bitmap.width) canvas.width = bitmap.width;
            if (canvas.height !== bitmap.height) canvas.height = bitmap.height;
            canvas.getContext("2d").drawImage(bitmap, 0, 0);
            if (framesDrawn === 1 || framesDrawn % 60 === 0) {
              const box = canvas.getBoundingClientRect();
              console.log(`VideoFeed: drew frame #${framesDrawn} bitmap=${bitmap.width}x${bitmap.height} canvas.attr=${canvas.width}x${canvas.height} canvas.cssBox=${box.width.toFixed(0)}x${box.height.toFixed(0)} at (${box.left.toFixed(0)},${box.top.toFixed(0)})`);
            }
          } else if (framesDrawn === 1) {
            console.log(`VideoFeed: decoded frame #1 (${bitmap.width}x${bitmap.height}) but canvasRef.current is`, canvas);
          }
          bitmap.close();
        } catch (e) {
          decodeFailures++;
          if (decodeFailures === 1 || decodeFailures % 30 === 0) {
            console.error(`VideoFeed: decode failed x${decodeFailures} (part was ${jpegBytes.length}B, first bytes: ${jpegBytes.slice(0, 8)})`, e);
          }
        }
      }
    }

    async function run() {
      while (!cancelled) {
        try {
          const resp = await fetch("/video_feed", { signal: controller.signal, cache: "no-store" });
          console.log("VideoFeed: connected", resp.status, resp.headers.get("content-type"));
          if (!resp.body) throw new Error("no body");
          const reader = resp.body.getReader();
          let buf = new Uint8Array(0);

          while (!cancelled) {
            const { done, value } = await reader.read();
            if (done) { console.log("VideoFeed: stream ended (done=true)"); break; }
            const merged = new Uint8Array(buf.length + value.length);
            merged.set(buf, 0);
            merged.set(value, buf.length);
            buf = await drainFrames(merged);
          }
        } catch (e) {
          if (!cancelled) console.error("VideoFeed: stream error", e);
        }
        if (cancelled) return;
        await new Promise(r => setTimeout(r, 1500));
      }
    }

    run();
    return () => {
      cancelled = true;
      controller.abort();
    };
  }, []);

  return (
    <canvas ref={canvasRef} className="absolute inset-0 w-full h-full object-contain bg-black" />
  );
}

function App() {
  const [connected, setConnected] = useState(false);
  const [reconnecting, setReconnecting] = useState(false);
  const [settings, setSettings] = useState(null);
  const [pending, setPending] = useState({});
  const [telemetry, setTelemetry] = useState(null);
  const [logs, setLogs] = useState([]);
  const [events, setEvents] = useState([]);
  const [debugMode, setDebugMode] = useState(true);
  const [highContrast, setHighContrast] = useState(false);
  const [alarmMuted, setAlarmMuted] = useState(false);
  const [simActive, setSimActive] = useState(false);
  const [recording, setRecording] = useState(false);
  const [recordingFile, setRecordingFile] = useState(null);
  const [mode, setMode] = useState("live");
  const [replayFile, setReplayFile] = useState(null);
  const [availableRecordings, setAvailableRecordings] = useState([]);
  const [selectedRecording, setSelectedRecording] = useState("");
  const [activeTab, setActiveTab] = useState("System Logs");
  const [hardwareMode, setHardwareMode] = useState(false);
  const [panMinDeg, setPanMinDeg] = useState(-90);
  const [panMaxDeg, setPanMaxDeg] = useState(90);
  const [frameRecording, setFrameRecording] = useState(false);
  const [frameRecordCount, setFrameRecordCount] = useState(0);
  const [frameRecordMax, setFrameRecordMax] = useState(1200);
  const [frameRecordDir, setFrameRecordDir] = useState(null);
  const [frameRecordIntervalInput, setFrameRecordIntervalInput] = useState("1.0");
  const [frameRecordMaxInput, setFrameRecordMaxInput] = useState("1200");
  const [acousticRecording, setAcousticRecording] = useState(false);
  const [acousticAutoSaveDrone, setAcousticAutoSaveDrone] = useState(false);
  const [acousticDroneCount, setAcousticDroneCount] = useState(0);
  const [acousticNoiseCount, setAcousticNoiseCount] = useState(0);
  const [acousticMaxSamples, setAcousticMaxSamples] = useState(300);
  const [acousticWindowInput, setAcousticWindowInput] = useState("2.0");
  const [acousticMaxInput, setAcousticMaxInput] = useState("300");
  const [guiRecording, setGuiRecording] = useState(false);

  const wsRef = useRef(null);
  const backoffRef = useRef(1000);
  const prevStateRef = useRef("IDLE");
  const spectroCanvasRef = useRef(null);
  const waveChartRef = useRef(null);
  const waveCanvasRef = useRef(null);
  const guiRecorderRef = useRef(null);
  const guiChunksRef = useRef([]);
  const guiStreamRef = useRef(null);

  function refreshRecordings() {
    fetch("/recordings").then(r => r.json()).then(d => setAvailableRecordings(d.files || [])).catch(() => {});
  }

  const connect = useCallback(() => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    wsRef.current = ws;

    ws.onopen = () => {
      setConnected(true);
      setReconnecting(false);
      backoffRef.current = 1000;
      refreshRecordings();
    };
    ws.onclose = () => {
      setConnected(false);
      setReconnecting(true);
      const delay = backoffRef.current;
      backoffRef.current = Math.min(delay * 2, 10000);
      setTimeout(connect, delay);
    };
    ws.onerror = () => { ws.close(); };
    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
        case "settings_snapshot":
        case "settings_ack": {
          const { type, ...rest } = msg;
          setSettings(rest);
          setPending({});
          break;
        }
        case "telemetry": {
          setTelemetry(msg);
          setSimActive(!!msg.sim);
          setHardwareMode(!!msg.hardware);
          if (msg.frame_recording) {
            setFrameRecording(!!msg.frame_recording.active);
            setFrameRecordCount(msg.frame_recording.count || 0);
            if (msg.frame_recording.max_frames) setFrameRecordMax(msg.frame_recording.max_frames);
          }
          if (msg.acoustic_recording) {
            setAcousticRecording(!!msg.acoustic_recording.active);
            setAcousticAutoSaveDrone(!!msg.acoustic_recording.auto_save_drone);
            setAcousticDroneCount(msg.acoustic_recording.drone_count || 0);
            setAcousticNoiseCount(msg.acoustic_recording.noise_count || 0);
            if (msg.acoustic_recording.max_samples) setAcousticMaxSamples(msg.acoustic_recording.max_samples);
          }
          if (msg.state === "ENGAGED" && prevStateRef.current !== "ENGAGED" && !alarmMuted) beep();
          prevStateRef.current = msg.state;
          updateWaveform(msg.waveform);
          break;
        }
        case "spectrogram":
          drawSpectrogram(msg);
          break;
        case "log":
          setLogs(prev => [...prev.slice(-49), msg]);
          break;
        case "event":
          setEvents(prev => [msg, ...prev].slice(0, 100));
          break;
        case "recording_state":
          setRecording(!!msg.recording);
          setRecordingFile(msg.file || null);
          if (!msg.recording) refreshRecordings();
          break;
        case "frame_recording_state":
          setFrameRecording(!!msg.recording);
          setFrameRecordDir(msg.dir || null);
          setFrameRecordCount(msg.count || 0);
          if (msg.max_frames) setFrameRecordMax(msg.max_frames);
          break;
        case "acoustic_recording_state":
          setAcousticRecording(!!msg.recording);
          setAcousticAutoSaveDrone(!!msg.auto_save_drone);
          setAcousticDroneCount(msg.drone_count || 0);
          setAcousticNoiseCount(msg.noise_count || 0);
          if (msg.max_samples) setAcousticMaxSamples(msg.max_samples);
          break;
        case "mode":
          setMode(msg.mode);
          setReplayFile(msg.file || null);
          if (msg.mode === "replay") setSelectedRecording(msg.file || "");
          break;
        case "camera_range":
          if (typeof msg.min_deg === "number") setPanMinDeg(msg.min_deg);
          if (typeof msg.max_deg === "number") setPanMaxDeg(msg.max_deg);
          break;
        default:
          break;
      }
    };
  }, [alarmMuted]);

  const settingsRef = useRef(null);
  useEffect(() => { settingsRef.current = settings; }, [settings]);

  useEffect(() => { connect(); }, [connect]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === "p" || e.key === "P") {
        if (!e.shiftKey) setDebugMode(v => !v);
      }
      if (e.shiftKey && (e.key === "D" || e.key === "d")) {
        sendCommand({ command: "inject_demo_detection" });
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function sendCommand(payload) {
    if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify(payload));
    }
  }

  function updateSetting(key, value) {
    setSettings(prev => ({ ...prev, [key]: value }));
    setPending(prev => ({ ...prev, [key]: true }));
    sendCommand({ command: "update_settings", [key]: value });
  }

  function toggleSystem() {
    if (!settings) return;
    updateSetting("system_active", !settings.system_active);
  }

  function toggleRecording() {
    sendCommand({ command: "set_recording", enabled: !recording });
  }

  function toggleFrameRecording() {
    if (!frameRecording) {
      const interval_s = Math.max(0.1, parseFloat(frameRecordIntervalInput) || 1.0);
      const max_frames = Math.max(1, parseInt(frameRecordMaxInput, 10) || 1200);
      sendCommand({ command: "set_frame_recording", enabled: true, interval_s, max_frames });
    } else {
      sendCommand({ command: "set_frame_recording", enabled: false });
    }
  }

  // Records the whole dashboard (not just the video panel) as a real video
  // file, entirely client-side via getDisplayMedia + MediaRecorder - the
  // Jetson is never involved, so this doesn't touch its memory/storage at
  // all. Whether the recording lands on the Jetson or elsewhere just follows
  // wherever this browser tab is actually running (per SPEC.md, that's meant
  // to be a separate laptop viewing the dashboard over the network, not a
  // browser on the Jetson itself).
  async function startGuiRecording() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false });
      guiStreamRef.current = stream;
      guiChunksRef.current = [];

      const mimeCandidates = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
      const mimeType = mimeCandidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      guiRecorderRef.current = recorder;

      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) guiChunksRef.current.push(e.data); };
      recorder.onstop = () => { saveGuiRecording(); };
      // Covers the user stopping the share via the browser's own "Stop
      // sharing" bar instead of our button.
      stream.getVideoTracks()[0].onended = () => stopGuiRecording();

      recorder.start();
      setGuiRecording(true);
    } catch (e) {
      // Picker cancelled, or permission denied - nothing to recover from,
      // just stay in the not-recording state.
    }
  }

  function stopGuiRecording() {
    const recorder = guiRecorderRef.current;
    if (recorder && recorder.state !== "inactive") recorder.stop();
    const stream = guiStreamRef.current;
    if (stream) stream.getTracks().forEach(t => t.stop());
    guiStreamRef.current = null;
    setGuiRecording(false);
  }

  async function saveGuiRecording() {
    const blob = new Blob(guiChunksRef.current, { type: "video/webm" });
    guiChunksRef.current = [];
    if (blob.size === 0) return;
    const filename = `dashboard-recording-${new Date().toISOString().replace(/[:.]/g, "-")}.webm`;

    // File System Access API (Chrome/Edge) lets the viewer pick exactly
    // where to save - e.g. straight to a mounted external drive - instead of
    // always landing in the default Downloads folder. Firefox doesn't
    // implement this yet, hence the plain-download fallback below.
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "WebM video", accept: { "video/webm": [".webm"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      } catch (e) {
        // Save dialog cancelled, or the API errored - fall through so the
        // recording isn't lost, it just goes to the default download path.
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function toggleGuiRecording() {
    if (guiRecording) stopGuiRecording(); else startGuiRecording();
  }

  function toggleAcousticRecording() {
    if (!acousticRecording) {
      const window_s = Math.max(1.0, Math.min(5.0, parseFloat(acousticWindowInput) || 2.0));
      const max_samples = Math.max(1, parseInt(acousticMaxInput, 10) || 300);
      sendCommand({ command: "set_acoustic_recording", enabled: true, window_s, max_samples });
    } else {
      sendCommand({ command: "set_acoustic_recording", enabled: false });
    }
  }

  function toggleAcousticAutoSave(e) {
    const enabled = e.target.checked;
    setAcousticAutoSaveDrone(enabled);
    sendCommand({ command: "set_acoustic_auto_save", enabled });
  }

  function saveAcousticSample(label) {
    sendCommand({ command: "save_acoustic_sample", label });
  }

  function onSelectReplay(e) {
    const file = e.target.value;
    setSelectedRecording(file);
    if (!file) {
      sendCommand({ command: "set_mode", mode: "live" });
    } else {
      sendCommand({ command: "set_mode", mode: "replay", file });
    }
  }

  // Component D replaced the old polar radar (which showed nothing meaningful
  // once real per-target azimuth wasn't wired through hardware) with a compact
  // compass strip: camera bearing (real PTZ pan in hardware mode, a fabricated
  // value that eases toward the acoustic DOA in simulated mode) plotted against
  // the acoustic DOA sector, so convergence is visible directly. See
  // <CompassStrip> below.

  // ---------- Spectrogram (Canvas ImageData, never Chart.js) ----------
  function drawSpectrogram(msg) {
    const canvas = spectroCanvasRef.current;
    if (!canvas) return;
    canvas.width = msg.cols; canvas.height = msg.rows;
    const ctx = canvas.getContext("2d");
    const bin = atob(msg.data);
    const img = ctx.createImageData(msg.cols, msg.rows);
    for (let i = 0; i < msg.rows * msg.cols; i++) {
      const v = bin.charCodeAt(i);
      img.data[i * 4 + 0] = v;
      img.data[i * 4 + 1] = Math.min(255, v * 0.7);
      img.data[i * 4 + 2] = 255 - v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- Waveform (Chart.js, animation:false) ----------
  useEffect(() => {
    if (!waveCanvasRef.current) return;
    waveChartRef.current = new Chart(waveCanvasRef.current.getContext("2d"), {
      type: "line",
      data: { labels: Array.from({ length: 128 }, (_, i) => i),
        datasets: [{ data: [], borderColor: "#38bdf8", borderWidth: 1.5, pointRadius: 0, tension: 0.15 }] },
      options: {
        animation: false,
        responsive: true, maintainAspectRatio: false,
        scales: { x: { display: false }, y: { min: -1, max: 1, ticks: { color: "#6b7280" }, grid: { color: "#1f2430" } } },
        plugins: { legend: { display: false } },
      },
    });
  }, []);
  function updateWaveform(waveform) {
    const chart = waveChartRef.current;
    if (!chart || !waveform) return;
    chart.data.labels = waveform.map((_, i) => i);
    chart.data.datasets[0].data = waveform;
    chart.update("none");
  }

  function exportCSV() {
    const header = "timestamp,modality,class,acoustic_confidence,visual_confidence,combined_confidence,azimuth_deg\n";
    const rows = events.map(e =>
      `${new Date(e.ts * 1000).toISOString()},${e.modality},${e.cls},${e.acoustic_confidence ?? ""},${e.visual_confidence ?? ""},${e.combined_confidence ?? ""},${e.azimuth_deg}`
    ).join("\n");
    const blob = new Blob([header + rows], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "detection_events.csv";
    a.click();
  }

  const state = telemetry?.state || "IDLE";
  const latencyMs = telemetry ? ((Date.now() / 1000) - telemetry.sensor_ts) * 1000 : null;
  const camera = telemetry?.camera || { connected: false, fps: 0 };
  const audio = telemetry?.audio || { active: false, db: null };
  const jetson = telemetry?.jetson || { cpu: null, gpu: null, temp_c: null };
  const TABS = ["System Logs", "Pipeline Latency", "Audio Analytics", "Detection Events"];

  const LATENCY_STAGES = [
    { key: "mic_buffer_ms", label: "Microphone Buffer", tip: "Fixed by config (STEP_SECS) - the mic capture window size, not a measured delay." },
    { key: "fft_ms", label: "FFT / Mel-Spectrogram", tip: "Time to compute the log-mel spectrogram from the raw audio window (compute_live_logmel)." },
    { key: "cnn_ms", label: "Audio CNN Inference", tip: "Approximate: derived as (total audio processing time - FFT time). The forward pass isn't independently measurable." },
    { key: "frame_capture_ms", label: "Camera Frame Capture", tip: "Time for cv2.VideoCapture.read() to return a frame from the GStreamer pipeline." },
    { key: "yolo_ms", label: "YOLO / Tracking Inference", tip: "Time for the model.track() call. Only runs while TRACKING/ENGAGED - 0 elsewhere by design." },
    { key: "ptz_ms", label: "PTZ Command Dispatch", tip: "ONVIF network round-trip to the camera motors. Near-zero most ticks - a command is only sent when the velocity vector actually changes." },
  ];
  const LATENCY_MAX_MS = 250;

  // Groups stages by the actual thread that runs them in main_system.py, so
  // the summary shows real per-thread load instead of a meaningless flat sum
  // across unrelated threads. budgetKey, when set, is the cycle time that
  // thread must stay under to keep up in real time (mic_buffer_ms = STEP_SECS,
  // the acoustic thread's own step interval) - frame/PTZ threads have no fixed
  // config-derived budget to compare against.
  const THREAD_GROUPS = [
    { label: "Acoustic Thread", keys: ["fft_ms", "cnn_ms"], budgetKey: "mic_buffer_ms",
      tip: "FFT + CNN time, this thread's actual per-chunk work. Compared against its own capture window (STEP_SECS) - if it exceeds the budget, the thread is falling behind real-time audio." },
    { label: "Vision Thread", keys: ["frame_capture_ms", "yolo_ms"], budgetKey: null,
      tip: "Frame capture + YOLO time, this thread's work per frame. No fixed budget here - compare against the camera's actual frame interval to see if processing keeps up." },
    { label: "PTZ Worker Thread", keys: ["ptz_ms"], budgetKey: null,
      tip: "ONVIF command dispatch time - runs on its own dedicated thread, isolated from acoustic/vision processing." },
  ];

  return (
    <div className={(highContrast ? "hc " : "") + (state === "ENGAGED" ? "engaged-flash " : "") + "app-shell"}>

      {/* Alert overlay - absolute, never affects layout height or scroll */}
      {(state === "ENGAGED" || state === "DEGRADED") && (
        <div className="absolute top-0 inset-x-0 z-40 flex justify-center px-3 pt-2 pointer-events-none">
          {state === "ENGAGED" && (
            <div className="pointer-events-auto bg-red-700 text-white text-center py-1 px-6 rounded-b-lg font-bold animate-pulse shadow-lg">
              TARGET ENGAGED
            </div>
          )}
          {state === "DEGRADED" && (
            <div className="pointer-events-auto bg-red-900 border border-red-500 text-red-200 text-center py-1 px-6 rounded-b-lg shadow-lg">
              DEGRADED — hardware fault detected, attempting recovery
            </div>
          )}
        </div>
      )}

      {/* Header: fixed height (guaranteed via .header-bar), hidden (not unmounted) in Presentation Mode */}
      <div className={(debugMode ? "flex" : "hidden") + " header-bar items-center gap-3 bg-panel px-4 border-b border-gray-800 overflow-hidden"}>
        <div className="flex items-center gap-2 pr-4 border-r border-gray-700 shrink-0">
          <span className={`w-4 h-4 rounded-full inline-block ${STATE_COLORS[state]}`}></span>
          <span className="font-bold tracking-wide">{state}</span>
          {simActive && (
            <span className="ml-2 text-xs bg-red-600 text-white px-2 py-0.5 rounded font-extrabold tracking-wider animate-pulse">
              SIMULATOR / REPLAY
            </span>
          )}
        </div>

        <HeaderStat label="Camera" ok={camera.connected} okText={`Connected · ${fmt(camera.fps,1)} FPS`} badText="Disconnected" />
        <HeaderStat label="Mic Array" ok={audio.active} okText={`Active · ${fmt(audio.db,1)} dB`} badText="Muted" />
        <div className="text-sm shrink-0">
          <div className="text-gray-400 text-xs">Jetson</div>
          <div className="tabular-nums">CPU {jetson.cpu ?? "N/A"}% · GPU {jetson.gpu ?? "N/A"}% · {jetson.temp_c ?? "N/A"}°C</div>
        </div>
        <div className="text-sm shrink-0">
          <div className="text-gray-400 text-xs">Link</div>
          <div className={connected ? "text-green-400" : "text-red-400"}>{connected ? "Connected" : (reconnecting ? "Reconnecting…" : "Down")}</div>
        </div>
        <div className="text-sm shrink-0">
          <div className="text-gray-400 text-xs">End-to-End Latency</div>
          <div className="tabular-nums">{latencyMs !== null ? `${fmt(latencyMs,0)} ms` : "N/A"}</div>
        </div>
        <div className="text-sm shrink-0">
          <div className="text-gray-400 text-xs">Mode</div>
          <div className={mode === "replay" ? "text-red-400 font-semibold" : "text-gray-300"}>
            {mode === "replay" ? `REPLAY · ${replayFile || ""}` : "LIVE"}
          </div>
        </div>

        <div className="ml-auto flex items-center gap-2 shrink-0">
          <button onClick={() => setAlarmMuted(v => !v)}
            className={`px-3 py-1.5 rounded text-sm ${alarmMuted ? "bg-gray-700" : "bg-blue-700"}`}>
            {alarmMuted ? "Alarm Muted" : "Alarm On"}
          </button>
          <button onClick={() => setHighContrast(v => !v)} className="px-3 py-1.5 rounded text-sm bg-gray-700" title="High-contrast mode for projector">
            Contrast
          </button>

          <div className="w-px self-stretch bg-gray-700 mx-1"></div>

          <button onClick={toggleGuiRecording}
            title="Record the whole dashboard as a video file (screen/tab capture) - saved to your own device, not the Jetson"
            className={`px-3 py-1.5 rounded text-sm font-semibold flex items-center gap-1.5 ${guiRecording ? "bg-red-700" : "bg-gray-700"}`}>
            <span className={`w-2 h-2 rounded-full inline-block ${guiRecording ? "bg-red-300 animate-pulse" : "bg-gray-400"}`}></span>
            {guiRecording ? "Recording GUI…" : "Record GUI"}
          </button>

          <div className="w-px self-stretch bg-gray-700 mx-1"></div>

          <button disabled={!connected} onClick={toggleRecording}
            title="Capture live telemetry + spectrogram (not video) to a session file for later replay"
            className={`px-3 py-1.5 rounded text-sm font-semibold flex items-center gap-1.5 disabled:opacity-40 ${recording ? "bg-red-700" : "bg-gray-700"}`}>
            <span className={`w-2 h-2 rounded-full inline-block ${recording ? "bg-red-300 animate-pulse" : "bg-gray-400"}`}></span>
            {recording ? "Recording Telemetry…" : "Record Telemetry"}
          </button>

          <div className="w-px self-stretch bg-gray-700 mx-1"></div>

          <div className="flex items-center gap-1" title="Save sampled JPEG frames from the video feed to gui_dashboard/recordings/ for later model training">
            <button disabled={!connected} onClick={toggleFrameRecording}
              className={`px-3 py-1.5 rounded text-sm font-semibold flex items-center gap-1.5 disabled:opacity-40 ${frameRecording ? "bg-red-700" : "bg-gray-700"}`}>
              <span className={`w-2 h-2 rounded-full inline-block ${frameRecording ? "bg-red-300 animate-pulse" : "bg-gray-400"}`}></span>
              {frameRecording ? `Frames ${frameRecordCount}/${frameRecordMax}` : "Record Frames"}
            </button>
            {!frameRecording && (
              <React.Fragment>
                <input type="number" min="0.1" step="0.1" value={frameRecordIntervalInput}
                  onChange={e => setFrameRecordIntervalInput(e.target.value)}
                  title="Seconds between saved frames (lower = more frames = more disk use)" disabled={!connected}
                  className="w-14 bg-gray-800 border border-gray-600 rounded text-xs px-1 py-1.5 disabled:opacity-40" />
                <span className="text-xs text-gray-500">s /</span>
                <input type="number" min="1" step="10" value={frameRecordMaxInput}
                  onChange={e => setFrameRecordMaxInput(e.target.value)}

                <span className="text-xs text-gray-500">max</span>
              </React.Fragment>
            )}
          </div>

          <select disabled={!connected} value={selectedRecording} onChange={onSelectReplay}
            title="Replay a recorded session — the GUI behaves identically to live"
            className="bg-gray-800 border border-gray-600 rounded text-sm px-2 py-1.5 disabled:opacity-40">
            <option value="">Live</option>
            {availableRecordings.map(f => <option key={f} value={f}>{f}</option>)}

          <div className="w-px self-stretch bg-gray-700 mx-1"></div>

          <button disabled={!connected} onClick={toggleSystem}
            className={`px-4 py-1.5 rounded font-bold text-sm ${settings?.system_active ? "bg-red-600" : "bg-green-600"} disabled:opacity-40`}>
            {settings?.system_active ? "STOP" : "START"}
          </button>
        </div>
      </div>

      {/* Main-Content: fills everything between the header and the fixed-height bottom
          panel (guaranteed via .main-row). Tactical-Col (left) + Diagnostics-Col (right). */}
      <div className="main-row">

        {/* Tactical-Col: video (flex-grow, fills all remaining height) + a fixed-height
            compass strip stacked via .tactical-col/.video-box/.compass-strip - the video
            can never be squeezed by the compass since the compass no longer competes
            for flex-grow share (it has a fixed height instead). */}
        <div className={"tactical-col w-2/3 " + (debugMode ? "gap-3 p-3" : "gap-0 p-0")}>
          {debugMode && (
            <div className="shrink-0 flex justify-between items-center">
              <h2 className="font-semibold text-sm text-gray-300">Vision Feed</h2>
              <label className="text-xs flex items-center gap-1">
                <input type="checkbox" checked={!!settings?.draw_boxes}
                  onChange={e => updateSetting("draw_boxes", e.target.checked)} />
                Bounding Boxes
              </label>
            </div>
          )}

          {/* Video: outer .video-box is sized by flex-grow so it never dictates the
              tactical column's height from stream content - no reflow, no flicker.
              The inner .video-frame just fills .video-box completely (see its CSS
              rule for why it doesn't try to size itself to the 16:9 ratio directly
              anymore) - VideoFeed's own <canvas> carries object-fit: contain, which
              does the actual "shrink to fit, keep ratio, no distortion" job. */}
          <div className={"video-box w-full " + (debugMode ? "rounded-lg" : "")}>
            <div className="video-frame">
              <VideoFeed />
              {!camera.connected && (
                <div className="absolute inset-0 flex items-center justify-center text-gray-500 font-mono text-2xl bg-black">
                  NO SIGNAL
                </div>
              )}
            </div>
          </div>

          {debugMode && (
            <div className="shrink-0">
              <div className="text-xs text-gray-400 mb-1">YOLO Confidence</div>
              <div className="w-full bg-gray-800 rounded h-3">
                <div className="bg-green-500 h-3 rounded tabular-nums" style={{ width: `${(telemetry?.vision?.confidence || 0) * 100}%` }}></div>
              </div>
            </div>
          )}

          {/* Compass strip: camera bearing vs acoustic DOA, replacing the old polar
              radar. Fixed height (not flex-grow), so it never competes with the video
              for space - always live in both hardware and simulated mode (simulated
              values are explicitly fabricated for demo purposes, see telemetry_loop
              in main.py). */}
          <div className={"compass-strip w-full bg-panel p-1.5 " + (debugMode ? "rounded-lg" : "")}>
            <CompassStrip telemetry={telemetry} panMinDeg={panMinDeg} panMaxDeg={panMaxDeg} />
          </div>
        </div>

        {/* Diagnostics-Col: guaranteed fixed width via .sidebar-col, always mounted,
            CSS-hidden (not unmounted) in Presentation Mode, internally scrollable so
            it's never pushed off-screen. Split into "Live Hardware Controls" (actually
            wired to config.YOLO_CONF_THRESHOLD/config.AUDIO_CLASSIFICATION_THRESHOLD via
            hardware_bridge.py) and "Simulation / Replay Only" (everything else) - the
            second group is only dimmed/labeled when hardwareMode is true; in simulated
            or replay mode every control behaves exactly as before. */}
        <div className={(debugMode ? "flex" : "hidden") + " sidebar-col flex-col bg-panel p-3 border-l border-gray-800"}>
          <h2 className="font-semibold text-sm text-gray-300 mb-3 shrink-0">Hyperparameter Control Panel</h2>

          <div className="text-xs font-semibold text-green-400 uppercase tracking-wide mb-2">Live Hardware Controls</div>
          <div className="flex flex-col gap-3 mb-4">
            {SLIDER_DEFS.filter(def => def.liveHardware).map(def => (
              <SliderControl key={def.key} def={def} settings={settings} pending={pending} connected={connected} updateSetting={updateSetting} />
            ))}
          </div>

          {/* Acoustic Sample Recorder - hardware mode only (no real audio in
              simulated mode). drone/ fills automatically off real trigger events
              (toggle-able below for noisy environments prone to false positives);
              noise/ fills manually so the user picks their own representative
              quiet moments. Live counts let class balance be kept by eye. */}
          <div className="text-xs font-semibold text-green-400 uppercase tracking-wide mb-2 flex items-center gap-2">
            Acoustic Sample Recorder
            {!hardwareMode && <span className="normal-case bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded text-[10px] font-normal">Hardware Mode Only</span>}
          </div>
          <div className={"flex flex-col gap-2 mb-4 p-2 rounded border border-gray-700 " + (!hardwareMode ? "opacity-40" : "")}>
            <div className="flex items-center justify-between text-xs">
              <span className="text-gray-400">
                Drone: <span className="text-gray-200 tabular-nums">{acousticDroneCount}</span>
                {" / Noise: "}<span className="text-gray-200 tabular-nums">{acousticNoiseCount}</span>
              </span>
              <span className="text-gray-500 tabular-nums">cap {acousticMaxSamples}/class</span>
            </div>

            <label className="flex items-center gap-2 text-xs text-gray-300"
              title="When on, a sample is saved to drone/ automatically on every fresh acoustic trigger. Turn off in noisy environments prone to false positives.">
              <input type="checkbox" disabled={!connected || !hardwareMode} checked={acousticAutoSaveDrone} onChange={toggleAcousticAutoSave} />
              Auto-save on drone trigger
            </label>

            {!acousticRecording && (
              <div className="flex items-center gap-1 text-xs">
                <input type="number" min="1" max="5" step="0.5" value={acousticWindowInput}
                  onChange={e => setAcousticWindowInput(e.target.value)}
                  title="Clip length in seconds (1-5)" disabled={!connected || !hardwareMode}
                  className="w-14 bg-gray-800 border border-gray-600 rounded px-1 py-1 disabled:opacity-40" />
                <span className="text-gray-500">s /</span>
                <input type="number" min="1" step="10" value={acousticMaxInput}
                  onChange={e => setAcousticMaxInput(e.target.value)}
                  title="Max samples per class before auto-stop" disabled={!connected || !hardwareMode}
                  className="w-16 bg-gray-800 border border-gray-600 rounded px-1 py-1 disabled:opacity-40" />
                <span className="text-gray-500">max/class</span>
              </div>
            )}

            <button disabled={!connected || !hardwareMode} onClick={toggleAcousticRecording}
              className={`px-2 py-1.5 rounded text-xs font-semibold flex items-center justify-center gap-1.5 disabled:opacity-40 ${acousticRecording ? "bg-red-700" : "bg-gray-700"}`}>
              <span className={`w-2 h-2 rounded-full inline-block ${acousticRecording ? "bg-red-300 animate-pulse" : "bg-gray-400"}`}></span>
              {acousticRecording ? "Recording Armed" : "Arm Recording"}
            </button>

            <div className="flex gap-2">
              <button disabled={!connected || !hardwareMode || !acousticRecording} onClick={() => saveAcousticSample("drone")}
                className="flex-1 px-2 py-1.5 rounded text-xs font-semibold bg-sky-700 disabled:opacity-40">
                Save Drone Sample
              </button>
              <button disabled={!connected || !hardwareMode || !acousticRecording} onClick={() => saveAcousticSample("noise")}
                className="flex-1 px-2 py-1.5 rounded text-xs font-semibold bg-gray-600 disabled:opacity-40">
                Save Noise Sample
              </button>
            </div>
          </div>

          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 flex items-center gap-2">
            Simulation / Replay Only
            {hardwareMode && <span className="normal-case bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded text-[10px] font-normal">Inactive in Hardware Mode</span>}
          </div>
          <div className={"flex flex-col gap-3 " + (hardwareMode ? "opacity-40" : "")}>
            <div title="Inverts the camera pan/tilt axes to dynamically compensate for the upside-down physical installation of the PTZ housing on the tactical rig."
              className={"p-1 flex items-center gap-2 " + (pending.invert_camera_vector ? "pending-ring rounded" : "")}>
              <input type="checkbox" disabled={!connected} checked={!!settings?.invert_camera_vector}
                onChange={e => updateSetting("invert_camera_vector", e.target.checked)} />
              <span className="text-xs text-gray-300">Invert PTZ Camera Vector</span>
            </div>
          </div>
        </div>
      </div>

      {/* Bottom-Panel: guaranteed fixed height via .bottom-panel, separate section outside
          the main-content row entirely. Logs / Charts / Events tabs stay mounted at all
          times - only CSS display toggles between them, so nothing WebSocket-fed is torn
          down. Charts/logs never need scroll by design; only the events table body does. */}
      <div className={(debugMode ? "flex" : "hidden") + " bottom-panel mx-3 mb-3 bg-panel rounded-lg border border-gray-800"}>
        <div className="shrink-0 flex items-center border-b border-gray-800 px-2">
          {TABS.map(tab => (
            <button key={tab} onClick={() => setActiveTab(tab)} className={"tab-btn" + (activeTab === tab ? " active" : "")}>
              {tab}
            </button>
          ))}
          {activeTab === "Detection Events" && (
            <button onClick={exportCSV} className="ml-auto my-1 text-xs bg-gray-700 px-3 py-1 rounded">Export CSV</button>
          )}
        </div>

        <div className="tab-scroll-area p-3">
          <div className={(activeTab === "System Logs" ? "block" : "hidden") + " bg-black rounded p-2 font-mono text-xs"}>
            {logs.map((l, i) => (
              <div key={i} className={
                l.level === "ERROR" ? "text-red-400" : l.level === "WARNING" ? "text-yellow-400" : "text-gray-400"
              }>
                [{new Date(l.ts * 1000).toLocaleTimeString()}] {l.level}: {l.msg}
              </div>
            ))}
          </div>

          <div className={(activeTab === "Pipeline Latency" ? "block" : "hidden")}>
            <div className="text-xs text-gray-500 mb-3">Per-stage timing along the detection pipeline{!hardwareMode ? " — simulated demo values, no real pipeline to instrument" : ""}</div>
            {telemetry?.stage_latency_ms && (
              <div className="mb-4 pb-3 border-b border-gray-800">
                <div className="text-xs text-gray-500 mb-2">Load per thread</div>
                {THREAD_GROUPS.map(g => {
                  const val = g.keys.reduce((sum, k) => sum + (telemetry.stage_latency_ms[k] || 0), 0);
                  const budget = g.budgetKey ? telemetry.stage_latency_ms[g.budgetKey] : null;
                  const pct = budget ? Math.min(100, (val / budget) * 100) : Math.min(100, (val / LATENCY_MAX_MS) * 100);
                  const over = budget != null && val > budget;
                  return (
                    <div key={g.label} className="mb-2" title={g.tip}>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-gray-300">{g.label}</span>
                        <span className={"tabular-nums font-semibold " + (over ? "text-red-400" : "text-emerald-400")}>
                          {fmt(val,1)} ms{budget ? ` / ${fmt(budget,0)} ms budget` : ""}
                        </span>
                      </div>
                      <div className="w-full bg-gray-800 rounded h-2 overflow-hidden">
                        <div className={(over ? "bg-red-500" : "bg-emerald-500") + " h-2"} style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {LATENCY_STAGES.map(s => {
              const val = telemetry?.stage_latency_ms?.[s.key];
              const pct = val != null ? Math.min(100, (val / LATENCY_MAX_MS) * 100) : 0;
              return (
                <div key={s.key} className="mb-3" title={s.tip}>
                  <div className="flex justify-between text-xs text-gray-400 mb-1">
                    <span>{s.label}</span>
                    <span className="tabular-nums">{val != null ? `${fmt(val,1)} ms` : "N/A"}</span>
                  </div>
                  <div className="w-full bg-gray-800 rounded h-2 overflow-hidden">
                    <div className="bg-emerald-500 h-2" style={{ width: `${pct}%` }}></div>
                  </div>
                </div>

                <div className="bg-sky-500 h-3" style={{ width: `${(telemetry?.acoustic?.confidence || 0) * 100}%` }}></div>

              <canvas ref={spectroCanvasRef} className="spectro-canvas rounded"></canvas>
            </div>
            <div className="chart-mini">
              <div className="text-xs text-gray-400 mb-1">Waveform</div>
              <canvas ref={waveCanvasRef} className="w-full h-full block"></canvas>
            </div>
          </div>

          {/* Header row lives OUTSIDE the scrolling body entirely (genuinely fixed, not
              sticky-in-a-<table> which is a well-known cross-browser overlap landmine).
              Header and rows share the same gridTemplateColumns so columns line up. */}
          <div className={(activeTab === "Detection Events" ? "flex" : "hidden") + " flex-col h-full"}>
            <div className="grid text-gray-400 text-xs font-semibold border-b border-gray-800 shrink-0"
              style={{ gridTemplateColumns: EVENT_GRID_COLS }}>
              <div className="p-1">Timestamp</div>
              <div className="p-1">Modality</div>
              <div className="p-1">Class</div>
              <div className="p-1" title="Acoustic CNN confidence at the moment of this event">Acoustic</div>
              <div className="p-1" title="Visual (YOLO) confidence at the moment of this event, if the optical track had one">Visual</div>
              <div className="p-1" title="Simple 50/50 average of Acoustic + Visual, when both are known for this target">Combined</div>
              <div className="p-1">Azimuth</div>
            </div>
            <div className="flex-1 overflow-y-auto">
              {events.map((e, i) => (
                <div key={i}
                  className={"grid text-xs " + (e.modality === "Fused" ? "bg-red-950/50" : "")}
                  style={{ gridTemplateColumns: EVENT_GRID_COLS }}>
                  <div className="p-1 tabular-nums">{new Date(e.ts * 1000).toLocaleTimeString()}</div>
                  <div className="p-1">{e.modality}{e.sim ? " (SIM)" : ""}</div>
                  <div className="p-1">{e.cls}</div>
                  <div className="p-1 tabular-nums">{fmt(e.acoustic_confidence,2)}</div>
                  <div className="p-1 tabular-nums">{fmt(e.visual_confidence,2)}</div>
                  <div className="p-1 tabular-nums">{fmt(e.combined_confidence,2)}</div>
                  <div className="p-1 tabular-nums">{fmt(e.azimuth_deg,1)}°</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CompassStrip({ telemetry, panMinDeg, panMaxDeg }) {
  const state = telemetry?.state || "IDLE";
  const doa = telemetry?.acoustic?.doa_deg ?? 0;
  const cameraPan = telemetry?.camera_pan_deg ?? 0;
  const diff = Math.abs(cameraPan - doa);
  const aligned = diff <= 15;
  const engaged = state === "ENGAGED";

  // Range comes from the live config (Jetson_files/config.py MIN_ANGLE/MAX_ANGLE,
  // sent once at connect via the "camera_range" message) rather than a hardcoded
  // +/-90 - the real PTZ can swing much wider than the optical FOV.
  const lo = (typeof panMinDeg === "number") ? panMinDeg : -90;
  const hi = (typeof panMaxDeg === "number") ? panMaxDeg : 90;
  const span = Math.max(1, hi - lo);
  const toPct = deg => Math.max(0, Math.min(100, ((deg - lo) / span) * 100));
  const doaLeftPct = toPct(doa - 15);
  const doaWidthPct = Math.max(0, toPct(doa + 15) - doaLeftPct);
  const ticks = [lo, lo + span * 0.25, lo + span * 0.5, lo + span * 0.75, hi];

  return (
    <div>
      <div className="text-xs text-gray-400 mb-1 flex justify-between">
        <span>Camera Bearing vs Acoustic DOA</span>
        <span className="tabular-nums">{aligned ? "ALIGNED" : `${fmt(diff, 0)}° off`}</span>
      </div>
      <div className="relative h-8 bg-black rounded overflow-hidden">
        {/* Camera optical FOV (+/-45deg), for context - independent of the wider mechanical pan range */}
        {(-45 >= lo && -45 <= hi) && <div className="absolute inset-y-0 border-l border-dashed border-blue-500/40" style={{ left: `${toPct(-45)}%` }}></div>}
        {(45 >= lo && 45 <= hi) && <div className="absolute inset-y-0 border-l border-dashed border-blue-500/40" style={{ left: `${toPct(45)}%` }}></div>}
        {(0 >= lo && 0 <= hi) && <div className="absolute inset-y-0 border-l border-gray-700" style={{ left: `${toPct(0)}%` }}></div>}
        {/* Acoustic DOA sector (+/-15deg, same array resolution as before) */}
        <div className={"absolute inset-y-0 " + (engaged ? "bg-red-500/40" : "bg-sky-500/30")}
          style={{ left: `${doaLeftPct}%`, width: `${doaWidthPct}%` }}></div>
        {/* Camera pan marker - green when aligned with the DOA sector, red while ENGAGED */}
        <div className={"absolute inset-y-0 w-1 " + (engaged ? "bg-red-400" : aligned ? "bg-green-400" : "bg-orange-400")}
          style={{ left: `${toPct(cameraPan)}%` }}></div>
      </div>
      <div className="flex justify-between text-[10px] text-gray-600 mt-0.5">
        {ticks.map((t, i) => <span key={i} className="tabular-nums">{Math.round(t)}°</span>)}
      </div>
    </div>
  );
}

function SliderControl({ def, settings, pending, connected, updateSetting }) {
  return (
    <div title={def.tip} className={pending[def.key] ? "pending-ring rounded p-1" : "p-1"}>
      <div className="text-xs text-gray-400 flex justify-between">
        <span>{def.label}</span>
        <span className="tabular-nums">{settings ? settings[def.key] : "--"}</span>
      </div>
      <input type="range" min={def.min} max={def.max} step={def.step}
        disabled={!connected}
        value={settings ? settings[def.key] : def.min}
        onChange={e => updateSetting(def.key, parseFloat(e.target.value))}
        className="w-full" />
    </div>
  );
}

function HeaderStat({ label, ok, okText, badText }) {
  return (
    <div className="text-sm">
      <div className="text-gray-400 text-xs">{label}</div>
      <div className={ok ? "text-green-400" : "text-red-400"}>{ok ? okText : badText}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
