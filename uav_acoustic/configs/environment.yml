# ==========================================================================
#  Development environment - ACOUSTIC side
#  (dataset cleaning, augmentation, CNN training / evaluation, mic test tools)
# ==========================================================================
#
#  For a normal computer (Windows / Linux / macOS). Anyone who clones the
#  repo can recreate it with:
#
#     conda env create -f uav_acoustic/configs/environment.yml
#     conda activate drone-acoustic
#
#  Only packages actually imported by uav_acoustic/ are listed.
#
#  --------------------------------------------------------------------------
#  !!  DO NOT use this file on the Jetson Orin Nano  !!
#  --------------------------------------------------------------------------
#  The Jetson runtime (Jetson_files/) needs JetPack-specific builds that are
#  NOT interchangeable with the packages below:
#    * PyTorch / torchvision       -> NVIDIA's JetPack (L4T) aarch64 wheels only
#    * TensorRT + GStreamer        -> come with JetPack, not pip/conda
#    * OpenCV                      -> must be built WITH GStreamer support
#    * PortAudio (pyaudio), libusb -> system packages + a udev rule for the mic
#  A plain `conda env create` / `pip install` will NOT produce a working
#  Jetson build - the versions must match the installed JetPack release.
# ==========================================================================

name: drone-acoustic

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # --- deep learning (model.py, train.py, preprocess_RT.py, evaluation) ---
  - pytorch
  - cpuonly              # training / eval run on CPU on a normal dev machine

  # --- data + math ---
  - numpy
  - pandas               # cleaning.py, preprocess_train.py, augmentation.py, train.py
  - scikit-learn         # training / evaluation metrics (confusion matrix, F1, ROC...)
  - matplotlib           # training curves + evaluation plots

  # --- audio DSP ---
  - librosa              # log-mel spectrograms throughout the pipeline
  - numba                # librosa's runtime accelerator (pinned for a clean solve)
  - scipy                # librosa dependency + signal helpers

  # --- ReSpeaker 4-mic array control (usb.core / usb.util) ---
  - pyusb                # uav_acoustic/src/ReSpeaker_files/

  - pip:
      - soundfile        # augmentation.py + evaluation: WAV read / write
      - sounddevice      # preprocess_RT.py: live microphone capture
      - libusb-package   # bundled libusb backend so pyusb works with no system libusb
